<div style="width:265px;min-width:265px;background:white;border-right:1px solid #e8e8e8;height:calc(100vh - 56px);overflow-y:auto;display:flex;flex-direction:column;padding-top:16px;">

    <div style="padding:0 16px 12px;">
        <input type="text" placeholder="🔍  Search listings" oninput="filterListings(this.value)" style="width:100%;padding:9px 14px;border:1.5px solid #e0e0e0;border-radius:22px;font-size:13px;color:#333;background:white;outline:none;box-sizing:border-box;font-family:'Inter',sans-serif;">
    </div>

    {% for listing in listings %}
    <a href="/?listing_id={{ listing.id }}&month={{ month }}&year={{ year }}"
       class="listing-item"
       data-name="{{ listing.room_title|lower }}"
       style="display:flex;align-items:center;padding:10px 16px;text-decoration:none;border-bottom:1px solid #f0f0f0;background:{% if selected_listing_id == listing.id %}#f0fafb{% else %}white{% endif %};cursor:pointer;position:relative;">
        {% if listing.room_image %}
        <img src="{{ listing.room_image.url }}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;margin-right:12px;flex-shrink:0;border:2px solid #e8e8e8;">
        {% else %}
        <div style="width:44px;height:44px;border-radius:50%;background:#e8f8fa;color:#00b4b4;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;margin-right:12px;flex-shrink:0;border:2px solid #e8e8e8;">{{ listing.room_title|first|upper }}</div>
        {% endif %}
        <span style="font-size:13px;color:#333;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ listing.room_title }}</span>
        <span style="color:#bbb;font-size:18px;padding-left:8px;flex-shrink:0;">⋮</span>
    </a>
    {% empty %}
    <div style="padding:24px 16px;text-align:center;color:#aaa;font-size:13px;">
        No listings yet.<br>
        <a href="/listings/add/" style="color:#00b4b4;font-weight:500;">Add a listing →</a>
    </div>
    {% endfor %}

</div>

<script>
function filterListings(query) {
    document.querySelectorAll('.listing-item').forEach(function(item) {
        item.style.display = item.dataset.name.includes(query.toLowerCase()) ? 'flex' : 'none';
    });
}
</script>
